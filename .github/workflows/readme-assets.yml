name: Update README assets

on:
  schedule:
    - cron: "17 4 * * *" # daily at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GH_STATS_TOKEN (PAT with repo + read:user) includes private stats; GITHUB_TOKEN covers public only.
      STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      STATS_OPTIONS: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true
      LANGS_OPTIONS: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true

    steps:
      - uses: actions/checkout@v7

      - name: Prepare assets folder
        run: mkdir -p assets

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&theme=github_dark
          path: assets/stats-dark.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&theme=default
          path: assets/stats-light.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTIONS }}&theme=github_dark
          path: assets/top-langs-dark.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTIONS }}&theme=default
          path: assets/top-langs-light.svg
          token: ${{ env.STATS_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Update README assets" || exit 0
          git push
